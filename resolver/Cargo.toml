[package]
name = "hiero-did-resolver"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Mirror-node DID resolution and document reconstruction for did:hedera"
keywords = ["did", "hedera", "resolver", "mirror-node"]
categories = ["cryptography", "web-programming::http-client"]

[dependencies]
hiero-sdk = { workspace = true }
hiero-did-core = { workspace = true }
hiero-did-messages = { workspace = true }
hiero-did-hcs = { workspace = true }
hiero-did-signer = { workspace = true }
hiero-did-utils = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
ciborium = { workspace = true }
async-trait = { workspace = true }
time = { workspace = true }

[dev-dependencies]
dotenvy = { workspace = true }
hiero-did-client = { workspace = true }
# No `version` here on purpose: this is a dev-only, test-only dependency.
# Cargo strips path dev-dependencies without a `version` from the published
# manifest, so publishing `hiero-did-resolver` no longer requires
# `hiero-did-registrar` to already exist on crates.io at a matching version.
# (Pinning a version here caused `cargo publish --dry-run` to fail with
# "failed to select a version for the requirement `hiero-did-registrar = \"^0.1.3\"`"
# whenever resolver was published before registrar. registrar's dev-dependency
# back on resolver has the same treatment for the same reason.)
hiero-did-registrar = { path = "../registrar" }
serial_test = { workspace = true }
tokio = { workspace = true }
