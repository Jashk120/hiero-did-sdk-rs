[package]
name = "hiero-did-signer"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Ed25519 signing and verification helpers for did:hedera"
keywords = ["did", "hedera", "ed25519", "signature"]
categories = ["cryptography"]

[dependencies]
hiero-did-core = { workspace = true }
ed25519-dalek = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["blocking"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[features]
vault = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:base64"]

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true }
