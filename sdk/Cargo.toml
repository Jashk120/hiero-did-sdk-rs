[package]
name = "hiero-did-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for did:hedera — create, resolve, and manage Hedera DIDs"
readme = "../README.md"

[dependencies]
hiero-did-anoncreds = { workspace = true }
hiero-did-client = { workspace = true }
hiero-did-core = { workspace = true }
hiero-did-hcs = { workspace = true }
hiero-did-lifecycle = { workspace = true }
hiero-did-method = { workspace = true }
hiero-did-messages = { workspace = true }
hiero-did-registrar = { workspace = true }
hiero-did-resolver = { workspace = true }
hiero-did-utils = { workspace = true }
hiero-did-signer = { workspace = true }

[features]
default = ["vault"]
vault = ["hiero-did-signer/vault"]

[dev-dependencies]
async-trait = { workspace = true }
dotenvy = { workspace = true }
hiero-sdk = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
