[workspace]
members = [
    "core",
    "messages",
    "hcs",
    "method",
    "registrar",
    "resolver",
    "signer",
    "sdk",
    "client",
    "anoncreds",
    "lifecycle",
    "utils",
]
resolver = "2"

# Shared package metadata. Members inherit these with `field.workspace = true`
# instead of repeating them, so e.g. a version bump is a single-line change
# here instead of an edit in every crate's Cargo.toml.
[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Jashk120/hiero-did-sdk-rs"

[workspace.dependencies]
# --- workspace-internal crates ---
# Keeping these here too means every member just writes
# `hiero-did-core = { workspace = true }` and the path + version are
# defined in exactly one place.
hiero-did-core = { path = "core", version = "0.1.3" }
hiero-did-client = { path = "client", version = "0.1.3" }
hiero-did-hcs = { path = "hcs", version = "0.1.3" }
hiero-did-utils = { path = "utils", version = "0.1.3" }
hiero-did-lifecycle = { path = "lifecycle", version = "0.1.3" }
hiero-did-messages = { path = "messages", version = "0.1.3" }
hiero-did-method = { path = "method", version = "0.1.3" }
hiero-did-signer = { path = "signer", version = "0.1.3" }
hiero-did-registrar = { path = "registrar", version = "0.1.3" }
hiero-did-resolver = { path = "resolver", version = "0.1.3" }
hiero-did-anoncreds = { path = "anoncreds", version = "0.1.3" }

# --- external crates ---
async-trait = "0.1"
base64 = "0.22.1"
bs58 = "0.5.1"
chrono = { version = "0.4.44", features = ["serde"] }
ciborium = "0.2"
dotenvy = "0.15.7"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures-util = "0.3"
hex = "0.4"
hiero-sdk = { version = "0.45.0", features = ["serde"] }
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13.3", features = ["json"] }
rust_decimal = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serial_test = "3"
sha2 = "0.10"
thiserror = "2.0.18"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
zstd = "0.13"
